<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Base64 → MP3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0c0f;
    --surface: #14141a;
    --border: #2a2a38;
    --border-active: #5a5aff;
    --accent: #5a5aff;
    --accent2: #ff5a8a;
    --text: #e8e8f0;
    --muted: #6868a0;
    --success: #3ddc84;
    --error: #ff4f6e;
    --mono: 'Space Mono', monospace;
    --sans: 'Noto Sans SC', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 60px;
    position: relative;
    overflow-x: hidden;
  }

  /* Background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 40px 40px;
    opacity: 0.25;
    pointer-events: none;
    z-index: 0;
  }

  /* Glow orbs */
  body::after {
    content: '';
    position: fixed;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(90,90,255,0.08) 0%, transparent 70%);
    top: -100px;
    left: -100px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    width: 100%;
    max-width: 680px;
    position: relative;
    z-index: 1;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 36px;
    animation: fadeDown 0.6s ease both;
  }

  .badge {
    display: inline-block;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 4px 10px;
    margin-bottom: 16px;
    text-transform: uppercase;
  }

  h1 {
    font-family: var(--mono);
    font-size: clamp(28px, 6vw, 48px);
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: -1px;
  }

  h1 .arrow {
    color: var(--accent2);
    display: inline-block;
    animation: pulse 2s ease-in-out infinite;
  }

  .subtitle {
    margin-top: 10px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 300;
    letter-spacing: 1px;
  }

  /* Card */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 28px;
    margin-bottom: 16px;
    animation: fadeUp 0.5s ease both;
  }

  .card:nth-child(2) { animation-delay: 0.1s; }
  .card:nth-child(3) { animation-delay: 0.2s; }

  .card-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .card-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* Textarea */
  textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 11px;
    line-height: 1.7;
    padding: 14px;
    resize: vertical;
    min-height: 160px;
    outline: none;
    transition: border-color 0.2s;
    -webkit-appearance: none;
    word-break: break-all;
  }

  textarea::placeholder { color: var(--muted); opacity: 0.6; }

  textarea:focus {
    border-color: var(--border-active);
    box-shadow: 0 0 0 1px var(--border-active) inset, 0 0 20px rgba(90,90,255,0.05);
  }

  /* Filename */
  .filename-row {
    display: flex;
    gap: 10px;
    align-items: stretch;
  }

  .input-wrap {
    flex: 1;
    position: relative;
  }

  .input-wrap input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    padding: 12px 14px;
    outline: none;
    transition: border-color 0.2s;
    -webkit-appearance: none;
    border-radius: 0;
  }

  .input-wrap input:focus { border-color: var(--border-active); }

  .ext-badge {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-family: var(--mono);
    font-size: 10px;
    color: var(--accent2);
    letter-spacing: 1px;
  }

  /* Buttons */
  .btn {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 13px 22px;
    border: none;
    cursor: pointer;
    transition: all 0.15s;
    -webkit-appearance: none;
    white-space: nowrap;
  }

  .btn-primary {
    background: var(--accent);
    color: #fff;
  }

  .btn-primary:hover, .btn-primary:active {
    background: #7a7aff;
    transform: translateY(-1px);
  }

  .btn-primary:active { transform: translateY(0); }

  .btn-secondary {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
  }

  .btn-secondary:hover { border-color: var(--muted); color: var(--text); }

  /* Action row */
  .action-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 12px;
  }

  .btn-action {
    flex: 1;
    min-width: 140px;
    padding: 16px;
    font-size: 13px;
  }

  /* Status */
  .status {
    padding: 14px 16px;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.5px;
    line-height: 1.6;
    border-left: 3px solid;
    display: none;
    animation: fadeIn 0.3s ease;
  }

  .status.show { display: block; }
  .status.ok { border-color: var(--success); color: var(--success); background: rgba(61,220,132,0.05); }
  .status.err { border-color: var(--error); color: var(--error); background: rgba(255,79,110,0.05); }
  .status.info { border-color: var(--accent); color: var(--accent); background: rgba(90,90,255,0.05); }

  /* iOS notice */
  .ios-notice {
    background: rgba(90,90,255,0.07);
    border: 1px solid rgba(90,90,255,0.25);
    padding: 16px;
    margin-bottom: 16px;
    display: none;
    animation: fadeIn 0.3s ease;
  }

  .ios-notice.show { display: block; }

  .ios-notice-title {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--accent);
    margin-bottom: 8px;
    text-transform: uppercase;
  }

  .ios-notice p {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.7;
  }

  .ios-notice strong { color: var(--text); }

  /* Audio player */
  .audio-wrap {
    margin-top: 16px;
    display: none;
  }

  .audio-wrap.show { display: block; }

  audio {
    width: 100%;
    height: 48px;
    outline: none;
    border-radius: 0;
    filter: invert(1) hue-rotate(180deg);
  }

  /* Progress bar */
  .progress-bar-wrap {
    height: 2px;
    background: var(--border);
    margin-top: 16px;
    overflow: hidden;
    display: none;
  }

  .progress-bar-wrap.show { display: block; }

  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    width: 0%;
    transition: width 0.3s ease;
  }

  /* Footer */
  .footer {
    text-align: center;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--border);
    letter-spacing: 2px;
    margin-top: 36px;
    animation: fadeIn 1s ease both 0.5s;
  }

  /* Animations */
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @keyframes pulse {
    0%, 100% { transform: translateX(0); }
    50% { transform: translateX(4px); }
  }

  /* Mobile */
  @media (max-width: 480px) {
    .card { padding: 20px; }
    .filename-row { flex-direction: column; }
    .btn-action { min-width: 100%; }
  }
</style>
</head>
<body>

<div class="container">

  <div class="header">
    <div class="badge">工具 / TOOL</div>
    <h1>BASE64 <span class="arrow">→</span> MP3</h1>
    <p class="subtitle">粘贴 Base64 编码，转换并下载音频文件</p>
  </div>

  <!-- iOS Notice (shown on iOS) -->
  <div class="ios-notice" id="iosNotice">
    <div class="ios-notice-title">📱 iOS 使用说明</div>
    <p>iOS Safari 限制文件直接下载。转换后请点击 <strong>「在新标签页打开」</strong>，然后点击 Safari 底部的 <strong>分享按钮 →「存储到「文件」」</strong> 即可保存 MP3。</p>
  </div>

  <!-- Step 1: Input -->
  <div class="card">
    <div class="card-label">01 · 粘贴 Base64 数据</div>
    <textarea
      id="b64input"
      placeholder="粘贴 Base64 字符串（支持带或不带前缀）&#10;例：data:audio/mpeg;base64,//uQxAAAc... 或直接 //uQxAAAc..."
      spellcheck="false"
      autocomplete="off"
    ></textarea>
    <div style="margin-top:10px; display:flex; gap:8px; flex-wrap:wrap;">
      <button class="btn btn-secondary" onclick="clearInput()">清空</button>
      <button class="btn btn-secondary" onclick="pasteFromClipboard()">从剪贴板粘贴</button>
      <span id="charCount" style="margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--muted); align-self:center;"></span>
    </div>
  </div>

  <!-- Step 2: Options -->
  <div class="card">
    <div class="card-label">02 · 文件名设置</div>
    <div class="filename-row">
      <div class="input-wrap">
        <input type="text" id="filename" value="audio" placeholder="文件名（不含扩展名）">
        <span class="ext-badge">.mp3</span>
      </div>
    </div>
  </div>

  <!-- Step 3: Actions -->
  <div class="card">
    <div class="card-label">03 · 转换与下载</div>

    <div class="progress-bar-wrap" id="progressWrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="status" id="statusBox"></div>

    <div class="audio-wrap" id="audioWrap">
      <audio id="audioPlayer" controls></audio>
    </div>

    <div class="action-row">
      <button class="btn btn-primary btn-action" onclick="convert()">▶ 转换 + 播放</button>
      <button class="btn btn-primary btn-action" id="downloadBtn" onclick="doDownload()" style="background:var(--accent2); display:none;">↓ 下载 MP3</button>
      <button class="btn btn-secondary btn-action" id="openBtn" onclick="openInTab()" style="display:none;">⬡ 在新标签页打开</button>
    </div>
  </div>

  <div class="footer">BASE64 → MP3 · 本地处理 · 无上传 · NO DATA SENT</div>

</div>

<script>
  // Detect iOS
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);

  if (isIOS) {
    document.getElementById('iosNotice').classList.add('show');
  }

  let currentDataUrl = null;
  let currentObjectUrl = null;

  // Char count
  const b64input = document.getElementById('b64input');
  b64input.addEventListener('input', () => {
    const len = b64input.value.trim().length;
    const cc = document.getElementById('charCount');
    cc.textContent = len > 0 ? `${len.toLocaleString()} chars` : '';
  });

  function showStatus(msg, type='info') {
    const el = document.getElementById('statusBox');
    el.textContent = msg;
    el.className = `status show ${type}`;
  }

  function setProgress(pct) {
    const wrap = document.getElementById('progressWrap');
    const bar = document.getElementById('progressBar');
    if (pct === null) {
      wrap.classList.remove('show');
      bar.style.width = '0%';
    } else {
      wrap.classList.add('show');
      bar.style.width = pct + '%';
    }
  }

  function clearInput() {
    document.getElementById('b64input').value = '';
    document.getElementById('charCount').textContent = '';
    document.getElementById('statusBox').className = 'status';
    document.getElementById('audioWrap').classList.remove('show');
    document.getElementById('downloadBtn').style.display = 'none';
    document.getElementById('openBtn').style.display = 'none';
    setProgress(null);
    currentDataUrl = null;
    if (currentObjectUrl) { URL.revokeObjectURL(currentObjectUrl); currentObjectUrl = null; }
  }

  async function pasteFromClipboard() {
    try {
      const text = await navigator.clipboard.readText();
      document.getElementById('b64input').value = text;
      b64input.dispatchEvent(new Event('input'));
      showStatus('✓ 已从剪贴板粘贴', 'ok');
    } catch(e) {
      showStatus('请手动粘贴（浏览器限制剪贴板读取）', 'err');
    }
  }

  function extractBase64(raw) {
    raw = raw.trim();
    // Strip data URI prefix if present
    const match = raw.match(/^data:audio\/[^;]+;base64,(.+)$/s);
    if (match) return match[1].trim();
    // Also handle generic data URI
    const match2 = raw.match(/^data:[^;]*;base64,(.+)$/s);
    if (match2) return match2[1].trim();
    return raw;
  }

  function convert() {
    const raw = document.getElementById('b64input').value;
    if (!raw.trim()) {
      showStatus('⚠ 请先粘贴 Base64 数据', 'err');
      return;
    }

    showStatus('⟳ 处理中...', 'info');
    setProgress(30);

    setTimeout(() => {
      try {
        const b64 = extractBase64(raw);

        // Validate base64 (basic check)
        if (!/^[A-Za-z0-9+/=\s]+$/.test(b64)) {
          throw new Error('检测到非法字符，请确认是有效的 Base64 字符串');
        }

        setProgress(60);

        // Decode
        const binary = atob(b64.replace(/\s/g, ''));
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
          bytes[i] = binary.charCodeAt(i);
        }

        setProgress(85);

        const blob = new Blob([bytes], { type: 'audio/mpeg' });

        // Revoke previous
        if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);

        currentObjectUrl = URL.createObjectURL(blob);
        currentDataUrl = 'data:audio/mpeg;base64,' + b64.replace(/\s/g, '');

        // Audio player
        const player = document.getElementById('audioPlayer');
        player.src = currentObjectUrl;
        document.getElementById('audioWrap').classList.add('show');

        setProgress(100);
        setTimeout(() => setProgress(null), 500);

        const kb = (blob.size / 1024).toFixed(1);
        showStatus(`✓ 转换成功 · ${kb} KB · 可播放或下载`, 'ok');

        document.getElementById('downloadBtn').style.display = '';
        document.getElementById('openBtn').style.display = '';

        // Auto play
        player.play().catch(() => {});

      } catch(e) {
        setProgress(null);
        showStatus('✗ 错误：' + e.message, 'err');
      }
    }, 80); // slight delay for UI feedback
  }

  function getFilename() {
    const name = document.getElementById('filename').value.trim() || 'audio';
    // Sanitize
    return name.replace(/[^a-zA-Z0-9_\-\u4e00-\u9fa5]/g, '_') + '.mp3';
  }

  function doDownload() {
    if (!currentObjectUrl) { showStatus('请先点击「转换 + 播放」', 'err'); return; }

    const filename = getFilename();

    if (isIOS || isSafari) {
      // iOS/Safari: can't reliably use blob URL download attribute
      // Use data URI approach and open in new tab
      openInTab();
      showStatus('iOS: 新标签页已打开 → 点击分享 → 存储到文件', 'info');
      return;
    }

    // Desktop download
    const a = document.createElement('a');
    a.href = currentObjectUrl;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    showStatus(`✓ 下载已开始：${filename}`, 'ok');
  }

  function openInTab() {
    if (!currentDataUrl) { showStatus('请先点击「转换 + 播放」', 'err'); return; }

    // Open data URL in new tab — on iOS Safari this opens the audio player
    // User can then tap Share → Save to Files
    const win = window.open(currentDataUrl, '_blank');
    if (!win) {
      // Popup blocked — fallback: create link
      const a = document.createElement('a');
      a.href = currentDataUrl;
      a.target = '_blank';
      a.rel = 'noopener';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    if (isIOS) {
      showStatus('iOS: 在 Safari 中点击底部分享按钮 → 「存储到「文件」」', 'info');
    } else {
      showStatus('✓ 已在新标签页打开', 'ok');
    }
  }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>WAV → MP3 Converter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+JP:wght@300;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --border: #2a2a2a;
    --accent: #e8ff5a;
    --accent2: #ff5a5a;
    --text: #f0f0f0;
    --muted: #555;
    --radius: 4px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px 60px;
  }

  /* Grid texture */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(232,255,90,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(232,255,90,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 540px;
  }

  header {
    margin-bottom: 48px;
    text-align: center;
  }

  .logo-line {
    font-family: 'Space Mono', monospace;
    font-size: clamp(28px, 8vw, 48px);
    font-weight: 700;
    letter-spacing: -1px;
    line-height: 1;
  }
  .logo-line .wav { color: var(--muted); }
  .logo-line .arrow { color: var(--accent); margin: 0 8px; }
  .logo-line .mp3 { color: var(--text); }

  .tagline {
    margin-top: 10px;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    font-family: 'Space Mono', monospace;
  }

  /* Drop zone */
  .drop-zone {
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 48px 24px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    position: relative;
    overflow: hidden;
  }

  .drop-zone:hover, .drop-zone.drag-over {
    border-color: var(--accent);
    background: rgba(232,255,90,0.04);
  }

  .drop-zone input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    width: 100%;
    height: 100%;
  }

  .drop-icon {
    font-size: 40px;
    margin-bottom: 16px;
    display: block;
  }

  .drop-label {
    font-family: 'Space Mono', monospace;
    font-size: 14px;
    color: var(--muted);
    line-height: 1.6;
  }
  .drop-label strong {
    color: var(--accent);
    display: block;
    font-size: 16px;
    margin-bottom: 6px;
  }

  /* File info card */
  .file-info {
    display: none;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
    margin-top: 16px;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: var(--muted);
  }
  .file-info.visible { display: flex; gap: 12px; align-items: center; }
  .file-name {
    flex: 1;
    color: var(--text);
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .file-size { color: var(--muted); }

  /* Settings */
  .settings {
    margin-top: 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
  }

  .settings-title {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  .setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .setting-row:last-child { margin-bottom: 0; }

  .setting-label {
    font-size: 13px;
    color: var(--text);
    font-weight: 300;
  }

  .setting-control select {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    padding: 6px 12px;
    border-radius: var(--radius);
    appearance: none;
    -webkit-appearance: none;
    cursor: pointer;
    min-width: 100px;
    text-align: center;
  }
  .setting-control select:focus {
    outline: none;
    border-color: var(--accent);
  }

  /* Convert button */
  .btn-convert {
    width: 100%;
    margin-top: 20px;
    padding: 18px;
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: var(--radius);
    font-family: 'Space Mono', monospace;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.2s;
  }
  .btn-convert:hover { opacity: 0.9; }
  .btn-convert:active { transform: scale(0.99); }
  .btn-convert:disabled {
    opacity: 0.3;
    cursor: not-allowed;
    transform: none;
  }

  /* Progress */
  .progress-wrap {
    display: none;
    margin-top: 20px;
  }
  .progress-wrap.visible { display: block; }

  .progress-label {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
  }

  .progress-bar-bg {
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.1s;
    border-radius: 2px;
  }

  /* Result */
  .result-card {
    display: none;
    margin-top: 20px;
    background: var(--surface);
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    padding: 20px;
    text-align: center;
  }
  .result-card.visible { display: block; }

  .result-title {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .btn-download {
    display: inline-block;
    padding: 12px 28px;
    background: transparent;
    border: 2px solid var(--accent);
    color: var(--accent);
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    text-decoration: none;
    border-radius: var(--radius);
    transition: background 0.2s, color 0.2s;
    cursor: pointer;
    margin-bottom: 8px;
  }
  .btn-download:hover {
    background: var(--accent);
    color: #000;
  }

  .ios-note {
    font-size: 11px;
    color: var(--muted);
    margin-top: 10px;
    line-height: 1.6;
    font-family: 'Space Mono', monospace;
  }

  /* Error */
  .error-msg {
    display: none;
    margin-top: 16px;
    padding: 12px 16px;
    background: rgba(255,90,90,0.08);
    border: 1px solid rgba(255,90,90,0.3);
    border-radius: var(--radius);
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: var(--accent2);
  }
  .error-msg.visible { display: block; }

  /* Reset btn */
  .btn-reset {
    display: none;
    width: 100%;
    margin-top: 12px;
    padding: 12px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    letter-spacing: 1px;
    cursor: pointer;
    border-radius: var(--radius);
    transition: border-color 0.2s, color 0.2s;
  }
  .btn-reset:hover { border-color: var(--text); color: var(--text); }
  .btn-reset.visible { display: block; }

  footer {
    position: relative;
    z-index: 1;
    margin-top: 48px;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    text-align: center;
    letter-spacing: 1px;
  }

  @media (max-width: 420px) {
    body { padding: 28px 16px 48px; }
    header { margin-bottom: 32px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="logo-line">
      <span class="wav">WAV</span>
      <span class="arrow">→</span>
      <span class="mp3">MP3</span>
    </div>
    <div class="tagline">本地转换 · 无需上传 · 隐私安全</div>
  </header>

  <!-- Drop zone -->
  <div class="drop-zone" id="dropZone">
    <input type="file" id="fileInput" accept=".wav,audio/wav,audio/wave,audio/x-wav">
    <span class="drop-icon">🎵</span>
    <div class="drop-label">
      <strong>选择或拖入 WAV 文件</strong>
      点击选择文件 · 支持拖放
    </div>
  </div>

  <!-- File info -->
  <div class="file-info" id="fileInfo">
    <span class="drop-icon" style="font-size:20px;margin-bottom:0">📄</span>
    <span class="file-name" id="fileName">—</span>
    <span class="file-size" id="fileSize">—</span>
  </div>

  <!-- Settings -->
  <div class="settings">
    <div class="settings-title">转换设置</div>
    <div class="setting-row">
      <span class="setting-label">比特率 Bitrate</span>
      <div class="setting-control">
        <select id="bitrateSelect">
          <option value="64">64 kbps</option>
          <option value="96">96 kbps</option>
          <option value="128" selected>128 kbps</option>
          <option value="192">192 kbps</option>
          <option value="320">320 kbps</option>
        </select>
      </div>
    </div>
    <div class="setting-row">
      <span class="setting-label">声道 Channels</span>
      <div class="setting-control">
        <select id="channelSelect">
          <option value="2" selected>立体声</option>
          <option value="1">单声道</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Convert button -->
  <button class="btn-convert" id="btnConvert" disabled>开始转换</button>

  <!-- Progress -->
  <div class="progress-wrap" id="progressWrap">
    <div class="progress-label">
      <span id="progressStatus">处理中...</span>
      <span id="progressPct">0%</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>
  </div>

  <!-- Error -->
  <div class="error-msg" id="errorMsg"></div>

  <!-- Result -->
  <div class="result-card" id="resultCard">
    <div class="result-title">✓ 转换完成</div>
    <div id="downloadArea"></div>
    <div class="ios-note" id="iosNote"></div>
  </div>

  <!-- Reset -->
  <button class="btn-reset" id="btnReset">↺ 重新转换</button>
</div>

<footer>ALL PROCESSING DONE LOCALLY · NO UPLOAD · NO DATA SENT</footer>

<!-- lamejs MP3 encoder -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>
<script>
(function() {
  const dropZone  = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const fileInfo  = document.getElementById('fileInfo');
  const fileName  = document.getElementById('fileName');
  const fileSize  = document.getElementById('fileSize');
  const btnConvert= document.getElementById('btnConvert');
  const progressWrap = document.getElementById('progressWrap');
  const progressBar  = document.getElementById('progressBar');
  const progressStatus = document.getElementById('progressStatus');
  const progressPct  = document.getElementById('progressPct');
  const resultCard= document.getElementById('resultCard');
  const downloadArea = document.getElementById('downloadArea');
  const iosNote   = document.getElementById('iosNote');
  const errorMsg  = document.getElementById('errorMsg');
  const btnReset  = document.getElementById('btnReset');
  const bitrateSelect = document.getElementById('bitrateSelect');
  const channelSelect = document.getElementById('channelSelect');

  let selectedFile = null;
  let isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

  // Drag & drop
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    const f = e.dataTransfer.files[0];
    if (f) handleFile(f);
  });

  fileInput.addEventListener('change', e => {
    if (e.target.files[0]) handleFile(e.target.files[0]);
  });

  function handleFile(file) {
    if (!file.name.toLowerCase().endsWith('.wav') &&
        !file.type.includes('wav') && !file.type.includes('wave')) {
      showError('请选择 WAV 格式的音频文件');
      return;
    }
    selectedFile = file;
    fileName.textContent = file.name;
    fileSize.textContent = formatBytes(file.size);
    fileInfo.classList.add('visible');
    btnConvert.disabled = false;
    hideError();
    resultCard.classList.remove('visible');
    btnReset.classList.remove('visible');
  }

  btnConvert.addEventListener('click', convertFile);

  btnReset.addEventListener('click', () => {
    selectedFile = null;
    fileInput.value = '';
    fileInfo.classList.remove('visible');
    btnConvert.disabled = true;
    progressWrap.classList.remove('visible');
    resultCard.classList.remove('visible');
    btnReset.classList.remove('visible');
    hideError();
    setProgress(0, '处理中...');
  });

  async function convertFile() {
    if (!selectedFile) return;
    if (typeof lamejs === 'undefined') {
      showError('MP3 编码器加载失败，请检查网络连接后刷新重试');
      return;
    }

    btnConvert.disabled = true;
    progressWrap.classList.add('visible');
    resultCard.classList.remove('visible');
    btnReset.classList.remove('visible');
    hideError();
    setProgress(0, '读取文件...');

    try {
      const arrayBuffer = await readFile(selectedFile);
      setProgress(10, '解码音频...');

      // Decode audio
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      const ctx = new AudioCtx();

      let audioBuffer;
      try {
        audioBuffer = await ctx.decodeAudioData(arrayBuffer);
      } catch(e) {
        throw new Error('音频解码失败，请确认文件是有效的 WAV 格式');
      }

      const numChannels = parseInt(channelSelect.value);
      const sampleRate = audioBuffer.sampleRate;
      const bitrate = parseInt(bitrateSelect.value);

      setProgress(20, '初始化编码器...');

      // Get PCM data
      const left  = audioBuffer.getChannelData(0);
      const right = numChannels === 2
        ? (audioBuffer.numberOfChannels > 1 ? audioBuffer.getChannelData(1) : audioBuffer.getChannelData(0))
        : null;

      // Encode in chunks to keep UI responsive
      const mp3encoder = new lamejs.Mp3Encoder(numChannels, sampleRate, bitrate);
      const BLOCK = 1152;
      const mp3Data = [];
      const total = left.length;

      setProgress(25, 'MP3 编码中...');

      for (let i = 0; i < total; i += BLOCK) {
        const end = Math.min(i + BLOCK, total);
        const leftChunk  = floatTo16BitPCM(left.subarray(i, end));
        const rightChunk = numChannels === 2
          ? floatTo16BitPCM(right.subarray(i, end))
          : leftChunk;

        const encoded = numChannels === 2
          ? mp3encoder.encodeBuffer(leftChunk, rightChunk)
          : mp3encoder.encodeBuffer(leftChunk);

        if (encoded.length > 0) mp3Data.push(encoded);

        // Update progress: 25% - 95%
        if (i % (BLOCK * 50) === 0) {
          const pct = 25 + Math.round((i / total) * 70);
          setProgress(pct, 'MP3 编码中...');
          await tick(); // yield to UI
        }
      }

      const flushed = mp3encoder.flush();
      if (flushed.length > 0) mp3Data.push(flushed);

      setProgress(98, '生成文件...');
      await tick();

      const blob = new Blob(mp3Data, { type: 'audio/mp3' });
      const outName = selectedFile.name.replace(/\.wav$/i, '') + '.mp3';
      const url = URL.createObjectURL(blob);

      setProgress(100, '完成！');

      // Show result
      resultCard.classList.add('visible');
      downloadArea.innerHTML = '';

      if (isIOS) {
        // iOS Safari: open in new tab
        const btn = document.createElement('a');
        btn.href = url;
        btn.target = '_blank';
        btn.className = 'btn-download';
        btn.textContent = '打开 MP3 文件';
        downloadArea.appendChild(btn);
        iosNote.textContent = `iOS 提示：点击后在新页面长按音频，选择"下载链接"保存到文件 App。文件名：${outName}`;
      } else {
        const btn = document.createElement('a');
        btn.href = url;
        btn.download = outName;
        btn.className = 'btn-download';
        btn.textContent = `↓ 下载 ${outName}`;
        downloadArea.appendChild(btn);
        iosNote.textContent = `文件大小：${formatBytes(blob.size)} · 比特率：${bitrate} kbps`;
      }

      btnReset.classList.add('visible');
      ctx.close();

    } catch (e) {
      showError(e.message || '转换失败，请重试');
      btnConvert.disabled = false;
      progressWrap.classList.remove('visible');
    }
  }

  // Helpers
  function readFile(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = e => resolve(e.target.result.slice(0));
      reader.onerror = () => reject(new Error('文件读取失败'));
      reader.readAsArrayBuffer(file);
    });
  }

  function floatTo16BitPCM(floatArr) {
    const out = new Int16Array(floatArr.length);
    for (let i = 0; i < floatArr.length; i++) {
      const s = Math.max(-1, Math.min(1, floatArr[i]));
      out[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
    }
    return out;
  }

  function tick() {
    return new Promise(r => setTimeout(r, 0));
  }

  function setProgress(pct, status) {
    progressBar.style.width = pct + '%';
    progressStatus.textContent = status;
    progressPct.textContent = pct + '%';
  }

  function showError(msg) {
    errorMsg.textContent = '⚠ ' + msg;
    errorMsg.classList.add('visible');
  }

  function hideError() {
    errorMsg.classList.remove('visible');
  }

  function formatBytes(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
  }
})();
</script>
</body>
</html>
